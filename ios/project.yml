# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). No server, no packages, no secrets.
# App/Site is china-train's built page (CI builds DE0CH/china-train into it): the reference behind `-reference`.
name: ChinaTrain
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  ChinaTrain:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Site/**", "Fonts/**"]
      - path: App/Fonts   # Archivo (OFL), the site's figure face
        type: folder
        buildPhase: resources
      - path: App/Site    # the reference page
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.chinatrain
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 火车路线规划
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
  ChinaTrainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ChinaTrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.chinatrain.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChinaTrain:
    build: { targets: { ChinaTrain: all, ChinaTrainUITests: [test] } }
    test: { targets: [ChinaTrainUITests] }
